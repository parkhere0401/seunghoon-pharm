
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경희대 약대 관리시스템 프로토타입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .khu-red { background-color: #8b0000; }
        .khu-text { color: #8b0000; }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="khu-red text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">KHU Pharmacy Lab</h1>
            <div class="space-x-6">
                <a href="#" class="hover:underline">동물실 신청</a>
                <a href="#" class="hover:underline">기기 예약</a>
                <a href="#" class="hover:underline">마이페이지</a>
                <button class="bg-white text-red-900 px-4 py-1 rounded text-sm font-bold">Info21 Logout</button>
            </div>
        </div>
    </nav>

    <main class="container mx-auto mt-8 p-4">
        <!-- Dashboard Card -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-red-700">
                <h2 class="font-bold text-lg mb-2">실험동물 반입</h2>
                <p class="text-gray-600 text-sm mb-4">IACUC 심의 결과 및 반입 신청서를 작성합니다.</p>
                <button class="khu-red text-white px-4 py-2 rounded w-full">신청하기</button>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-blue-700">
                <h2 class="font-bold text-lg mb-2">공동기기 예약</h2>
                <p class="text-gray-600 text-sm mb-4">약학대학 보유 고가 장비를 예약합니다.</p>
                <button class="bg-blue-800 text-white px-4 py-2 rounded w-full">예약하기</button>
            </div>
            <div class="bg-white p-6 rounded-lg shadow border-t-4 border-green-700">
                <h2 class="font-bold text-lg mb-2">LMO 관리대장</h2>
                <p class="text-gray-600 text-sm mb-4">취급 및 관리 이력을 기록합니다.</p>
                <button class="bg-green-800 text-white px-4 py-2 rounded w-full">작성하기</button>
            </div>
        </div>

        <!-- Table Example -->
        <div class="mt-12 bg-white p-6 rounded-lg shadow">
            <h2 class="text-xl font-bold mb-4">공동기기실 비품 현황 (예시)</h2>
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="border-b bg-gray-100">
                        <th class="p-3">자산명</th>
                        <th class="p-3">설치장소</th>
                        <th class="p-3">책임자</th>
                        <th class="p-3">상태</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="border-b">
                        <td class="p-3">냉동조직절편기</td>
                        <td class="p-3">B306호</td>
                        <td class="p-3">김OO 교수</td>
                        <td class="p-3 text-green-600 font-bold">사용가능</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
